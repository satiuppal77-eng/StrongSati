<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ── Data ──────────────────────────────────────────────────────────────────────
const BARBELL_WEIGHT = 20; // kg
const AVAILABLE_PLATES = [25, 20, 15, 10, 5, 2.5, 1.25]; // per side, largest first
const PROGRESSION_INCREMENT = 1.25; // kg added per side completion
const TIME_PROGRESSION_INCREMENT = 10; // seconds added per side completion
const DELOAD_PCT = 0.10; // 10% weight cut after consecutive fails
const FAILS_BEFORE_DELOAD = 3; // consecutive failed sessions that trigger a deload

const DEFAULT_PROGRAMS = {
  A: {
    name: "Workout A",
    exercises: [
      { name: "Squat",              sets: 5, reps: 5, weight: 47.5 },
      { name: "Bench Press",        sets: 5, reps: 5, weight: 72.5 },
      { name: "Barbell Row",        sets: 5, reps: 5, weight: 77.5 },
      { name: "Pullups",            sets: 3, reps: 8, weight: 61.5 },
      { name: "Hanging Knee Raise", sets: 3, reps: 8, weight: 25   },
      { name: "Hammer Curl",        sets: 5, reps: 5, weight: 18.5 },
    ],
  },
  B: {
    name: "Workout B",
    exercises: [
      { name: "Squat",          sets: 5, reps: 5,  weight: 50 },
      { name: "Overhead Press", sets: 5, reps: 5,  weight: 45 },
      { name: "Deadlift",       sets: 1, reps: 5,  weight: 75 },
      { name: "Barbell Curl",   sets: 3, reps: 8,  weight: 25 },

      { name: "Lunges",              sets: 5, reps: 8,  weight: 12.5 },
    ],

};

const SCHEDULE = [
  { key: "B", label: "Today"       },
  { key: "C", label: "Sat, 13 Jun" },
  { key: "A", label: "Sun, 14 Jun" },
  { key: "C", label: "Tue, 16 Jun" },

// ── Colours ───────────────────────────────────────────────────────────────────
const RED   = "#e8392a";
const BG    = "#000";
const CARD  = "#1c1c1e";
const GREY  = "#8e8e93";
const WHITE = "#ffffff";
const DIM   = "#3a3a3c";
const GREEN = "#34c759";
const ORANGE = "#f97316";

// ── Warmup calculator ─────────────────────────────────────────────────────────
function calcWarmups(workingWeight) {
  const round = (w) => Math.round(w / 2.5) * 2.5;
  const bar   = BARBELL_WEIGHT;
  if (workingWeight <= bar + 2.5) return [];
  const steps = [];
  steps.push({ pct: 0, weight: bar, reps: 10, note: "Bar only" });
  const gap = workingWeight - bar;
  if (gap > 10) {
    const w40 = round(workingWeight * 0.40);
    if (w40 > bar && w40 < workingWeight) steps.push({ pct: 40, weight: w40, reps: 8, note: "Light" });
  }
  if (gap > 20) {
    const w60 = round(workingWeight * 0.60);
    if (w60 > bar && w60 < workingWeight) steps.push({ pct: 60, weight: w60, reps: 5, note: "Moderate" });
  }
  if (gap > 15) {
    const w80 = round(workingWeight * 0.80);
    if (w80 > bar && w80 < workingWeight) steps.push({ pct: 80, weight: w80, reps: 3, note: "Heavy" });
  }
  if (gap > 25) {
    const w90 = round(workingWeight * 0.90);
    if (w90 > bar && w90 < workingWeight) steps.push({ pct: 90, weight: w90, reps: 2, note: "Near max" });
  }
  const seen = new Set();
  return steps.filter(s => {
    if (seen.has(s.weight)) return false;
    seen.add(s.weight);
    return true;
  });
}

// ── Plate calculator ──────────────────────────────────────────────────────────
function calcPlates(totalKg) {
  const perSide = (totalKg - BARBELL_WEIGHT) / 2;
  if (perSide <= 0) return [];
  let remaining = perSide;
  const result = [];
  for (const p of AVAILABLE_PLATES) {
    if (remaining <= 0) break;
    const count = Math.floor(remaining / p);
    if (count > 0) {
      result.push({ weight: p, count });
      remaining = Math.round((remaining - p * count) * 1000) / 1000;
    }
  }
  return result;
}

const PLATE_COLORS = {
  25: "#e63946", 20: "#457b9d", 15: "#f4a261",
  10: "#2d6a4f", 5: "#e9c46a", 2.5: "#adb5bd", 1.25: "#dee2e6",
};

// ── Web Audio bell ────────────────────────────────────────────────────────────
function playBell() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[880, 0.6], [1108, 0.3], [1320, 0.15]].forEach(([freq, gain], i) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(gain, ctx.currentTime + i * 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.5);
      osc.start(ctx.currentTime + i * 0.01);
      osc.stop(ctx.currentTime + 2.6);
    });
  } catch (e) { /* silent fail */ }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtWeight(ex) {
  if (ex.unit === "sec") return `${ex.sets}×${ex.reps}sec`;
  if (ex.weight === 0)   return `${ex.sets}×${ex.reps}`;
  return `${ex.sets}×${ex.reps} ${ex.weight}kg`;
}

function fmtTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, "0");
  const sec = (s % 60).toString().padStart(2, "0");
  return `${m}:${sec}`;
}

// ── Local storage helpers ─────────────────────────────────────────────────────
const STORAGE_KEY = "sl_state";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("Save failed", e);
  }
}

// ── Circle set button ─────────────────────────────────────────────────────────
function CircleBtn({ target, achieved, onTap, size = 46, accent = RED }) {
  const attempted = achieved !== null && achieved !== undefined;
  const isFull = attempted && achieved >= target;
  const isFail = attempted && achieved < target;
  const bg = isFull ? accent : isFail ? "#5a3a1a" : DIM;
  const textColor = isFull ? WHITE : isFail ? "#ffb454" : GREY;
  return (
    <div
      onClick={onTap}
      style={{
        width: size, height: size, borderRadius: "50%",
        background: bg, border: isFail ? "1.5px solid #ffb454" : "none",
        display: "flex", alignItems: "center", justifyContent: "center",
        cursor: "pointer", flexShrink: 0,
        transition: "background 0.15s", userSelect: "none",
      }}>
      <span style={{ color: textColor, fontSize: 14, fontWeight: 600 }}>
        {attempted ? achieved : target}
      </span>
    </div>
  );
}

// ── Rest Timer overlay ────────────────────────────────────────────────────────
const REST_SECS = 120;

function RestTimer({ onDismiss }) {
  const [secs, setSecs] = useState(REST_SECS);
  const [ringing, setRinging] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    intervalRef.current = setInterval(() => {
      setSecs(s => {
        if (s <= 1) {
          clearInterval(intervalRef.current);
          setRinging(true);
          playBell();
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, []);

  const pct = ((REST_SECS - secs) / REST_SECS) * 100;
  const r = 54;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.88)",
      display: "flex", flexDirection: "column", alignItems: "center",
      justifyContent: "center", zIndex: 100,
    }}>
      <div style={{ color: GREY, fontSize: 13, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 24 }}>
        {ringing ? "Rest over!" : "Rest"}
      </div>
      <svg width={130} height={130} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={65} cy={65} r={r} fill="none" stroke={DIM} strokeWidth={6} />
        <circle cx={65} cy={65} r={r} fill="none"
          stroke={ringing ? GREEN : RED} strokeWidth={6}
          strokeDasharray={`${dash} ${circ}`}
          strokeLinecap="round"
          style={{ transition: "stroke-dasharray 0.9s linear" }}
        />
      </svg>
      <div style={{
        position: "absolute", fontSize: 32, fontWeight: 700,
        color: ringing ? GREEN : WHITE, fontVariantNumeric: "tabular-nums",
      }}>
        {fmtTime(secs)}
      </div>
      <div style={{ marginTop: 36, display: "flex", gap: 14 }}>
        <button onClick={() => { setSecs(s => s + 30); setRinging(false); }} style={{
          background: DIM, border: "none", borderRadius: 22, padding: "10px 20px",
          color: WHITE, fontSize: 14, cursor: "pointer",
        }}>+30s</button>
        <button onClick={onDismiss} style={{
          background: RED, border: "none", borderRadius: 22, padding: "10px 24px",
          color: WHITE, fontSize: 14, fontWeight: 700, cursor: "pointer",
        }}>Skip</button>
      </div>
    </div>
  );
}

// ── Plank/time-based countdown overlay ────────────────────────────────────────
function PlankTimer({ seconds, exName, onComplete, onCancel }) {
  const [remaining, setRemaining] = useState(seconds);
  const [done, setDone] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    intervalRef.current = setInterval(() => {
      setRemaining(r => {
        if (r <= 1) {
          clearInterval(intervalRef.current);
          setDone(true);
          playBell();
          return 0;
        }
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, []);

  const pct = ((seconds - remaining) / seconds) * 100;
  const r = 54;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.92)",
      display: "flex", flexDirection: "column", alignItems: "center",
      justifyContent: "center", zIndex: 100,
    }}>
      <div style={{ color: WHITE, fontSize: 17, fontWeight: 700, marginBottom: 6 }}>{exName}</div>
      <div style={{ color: GREY, fontSize: 13, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 24 }}>
        {done ? "Hold complete!" : "Hold the position"}
      </div>
      <svg width={130} height={130} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={65} cy={65} r={r} fill="none" stroke={DIM} strokeWidth={6} />
        <circle cx={65} cy={65} r={r} fill="none"
          stroke={done ? GREEN : RED} strokeWidth={6}
          strokeDasharray={`${dash} ${circ}`}
          strokeLinecap="round"
          style={{ transition: "stroke-dasharray 0.9s linear" }}
        />
      </svg>
      <div style={{
        position: "absolute", fontSize: 32, fontWeight: 700,
        color: done ? GREEN : WHITE, fontVariantNumeric: "tabular-nums",
      }}>
        {fmtTime(remaining)}
      </div>
      <div style={{ marginTop: 36, display: "flex", gap: 14 }}>
        {!done ? (
          <button onClick={onCancel} style={{
            background: DIM, border: "none", borderRadius: 22, padding: "10px 24px",
            color: WHITE, fontSize: 14, cursor: "pointer",
          }}>Cancel</button>
        ) : (
          <button onClick={() => onComplete(seconds)} style={{
            background: RED, border: "none", borderRadius: 22, padding: "10px 28px",
            color: WHITE, fontSize: 14, fontWeight: 700, cursor: "pointer",
          }}>Done ✓</button>
        )}
      </div>
    </div>
  );
}

// ── Active Workout Screen ─────────────────────────────────────────────────────
function WorkoutScreen({ progKey, programs, onFinish, onBack, onWeightsChange }) {
  const prog = programs[progKey];

  const [done, setDone] = useState(() => {
    const d = {};
    prog.exercises.forEach((_, i) => { d[i] = {}; });
    return d;
  });
  const [weights, setWeights] = useState(() =>
    prog.exercises.map(ex => ({
      weight: ex.weight, sets: ex.sets, reps: ex.reps,
      failStreak: ex.failStreak || 0,
    }))
  );
  const [warmupDone, setWarmupDone] = useState({});
  const [showTimer, setShowTimer] = useState(false);
  const [editIdx, setEditIdx]     = useState(null);
  const [resultBanner, setResultBanner] = useState({});
  const [plankRun, setPlankRun]   = useState(null);

  function toggleWarmup(exIdx, wsIdx, sIdx) {
    const key = `${exIdx}-${wsIdx}-${sIdx}`;
    setWarmupDone(prev => {
      const next = { ...prev };
      if (next[key]) delete next[key];
      else { next[key] = true; setShowTimer(true); }
      return next;
    });
  }

  function evaluateExercise(exIdx, doneMap) {
    const w = weights[exIdx];
    const ex = prog.exercises[exIdx];
    const totalSets = w.sets;
    const attempts = Object.values(doneMap);
    if (attempts.length < totalSets) return;

    const allFull = attempts.every(r => r >= w.reps);
    const isTimeBased = ex.unit === "sec";

    if (allFull) {
      setWeights(p => p.map((v, i) => {
        if (i !== exIdx) return v;
        if (isTimeBased) return { ...v, reps: v.reps + TIME_PROGRESSION_INCREMENT, failStreak: 0 };
        return { ...v, weight: Math.round((v.weight + PROGRESSION_INCREMENT) * 100) / 100, failStreak: 0 };
      }));
      setResultBanner(b => ({
        ...b, [exIdx]: {
          type: "progress",
          text: isTimeBased
            ? `✓ All sets complete — next session: ${w.reps + TIME_PROGRESSION_INCREMENT}sec (+${TIME_PROGRESSION_INCREMENT}sec)`
            : `✓ All sets complete — next session: ${Math.round((w.weight + PROGRESSION_INCREMENT) * 100) / 100}kg (+${PROGRESSION_INCREMENT}kg)`,
        }
      }));
    } else {
      const newStreak = (w.failStreak || 0) + 1;
      if (newStreak >= FAILS_BEFORE_DELOAD) {
        setWeights(p => p.map((v, i) => {
          if (i !== exIdx) return v;
          if (isTimeBased) {
            const newReps = Math.max(5, Math.round(v.reps * (1 - DELOAD_PCT)));
            return { ...v, reps: newReps, failStreak: 0 };
          }
          const newWeight = Math.round(v.weight * (1 - DELOAD_PCT) / 1.25) * 1.25;
          return { ...v, weight: Math.max(BARBELL_WEIGHT, newWeight), failStreak: 0 };
        }));
        setResultBanner(b => ({
          ...b, [exIdx]: {
            type: "deload",
            text: `⚠ Failed ${FAILS_BEFORE_DELOAD}× in a row — deloading 10% next session`,
          }
        }));
      } else {
        setWeights(p => p.map((v, i) => i === exIdx ? { ...v, failStreak: newStreak } : v));
        setResultBanner(b => ({
          ...b, [exIdx]: {
            type: "retry",
            text: `Missed some reps — same weight next time (${newStreak}/${FAILS_BEFORE_DELOAD} fails)`,
          }
        }));
      }
    }
  }

  function toggleSet(exIdx, setIdx) {
    const ex = prog.exercises[exIdx];
    const isTimeBased = ex.unit === "sec";
    const target = weights[exIdx].reps;
    const current = done[exIdx][setIdx];

    if (isTimeBased && current === undefined) {
      setPlankRun({ exIdx, setIdx, seconds: target });
      return;
    }

    setDone(prev => {
      const copy = { ...prev, [exIdx]: { ...prev[exIdx] } };
      let next;
      if (current === undefined) next = target;
      else if (current > 0) next = current - 1;
      else next = undefined;

      if (next === undefined) delete copy[exIdx][setIdx];
      else copy[exIdx][setIdx] = next;

      if (current === undefined && next !== undefined && !isTimeBased) setShowTimer(true);

      const totalSets = weights[exIdx].sets;
      if (Object.keys(copy[exIdx]).length === totalSets) {
        evaluateExercise(exIdx, copy[exIdx]);
      } else {
        setResultBanner(b => {
          if (!b[exIdx]) return b;
          const nb = { ...b };
          delete nb[exIdx];
          return nb;
        });
      }
      return copy;
    });
  }

  function completePlankSet(achievedSeconds) {
    if (!plankRun) return;
    const { exIdx, setIdx } = plankRun;
    setPlankRun(null);
    setShowTimer(true);
    setDone(prev => {
      const copy = { ...prev, [exIdx]: { ...prev[exIdx], [setIdx]: achievedSeconds } };
      const totalSets = weights[exIdx].sets;
      if (Object.keys(copy[exIdx]).length === totalSets) {
        evaluateExercise(exIdx, copy[exIdx]);
      }
      return copy;
    });
  }

  useEffect(() => {
    onWeightsChange(progKey, weights, done);
  }, [weights, done]);

  function adjustSets(exIdx, delta) {
    setWeights(p => p.map((v, i) => i === exIdx ? { ...v, sets: Math.max(1, v.sets + delta) } : v));
    if (delta < 0) {
      setDone(prev => {
        const copy = { ...prev, [exIdx]: { ...prev[exIdx] } };
        const newTotal = Math.max(1, weights[exIdx].sets - 1);
        Object.keys(copy[exIdx]).forEach(k => { if (Number(k) >= newTotal) delete copy[exIdx][k]; });
        return copy;
      });
    }
  }

  const totalSets     = weights.reduce((a, w) => a + w.sets, 0);
  const completedSets = Object.values(done).reduce((a, d) => a + Object.keys(d).length, 0);
  const pct           = Math.round((completedSets / totalSets) * 100);

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", position: "relative" }}>
      <div style={{ background: CARD, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: WHITE, fontSize: 26, cursor: "pointer", padding: "0 8px 0 0", lineHeight: 1 }}>‹</button>
        <span style={{ color: WHITE, fontWeight: 700, fontSize: 16 }}>{prog.name}</span>
        <button onClick={onFinish} style={{ background: "none", border: "none", color: RED, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>Finish</button>
      </div>

      <div style={{ background: DIM, height: 3 }}>
        <div style={{ background: RED, height: 3, width: `${pct}%`, transition: "width 0.3s" }} />
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "0 0 16px" }}>
        {prog.exercises.map((ex, exIdx) => {
          const w = weights[exIdx];
          const exWithWeight = { ...ex, ...w };
          const isEditing = editIdx === exIdx;
          const isBarbell = !ex.unit && w.weight >= BARBELL_WEIGHT;
          const plates = isBarbell ? calcPlates(w.weight) : [];
          const warmupSets = isBarbell ? calcWarmups(w.weight) : [];
          const banner = resultBanner[exIdx];

          return (
            <div key={exIdx} style={{ padding: "16px 16px 0" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <span style={{ color: WHITE, fontSize: 16, fontWeight: 600 }}>{ex.name}</span>
                {!ex.unit ? (
                  isEditing ? (
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }} onClick={e => e.stopPropagation()}>
                      <input
                        autoFocus
                        type="text"
                        inputMode="decimal"
                        defaultValue={w.weight}
                        onKeyDown={e => {
                          if (e.key === "Enter") {
                            const val = parseFloat(e.target.value) || 0;
                            setWeights(p => p.map((v, i) => i === exIdx ? { ...v, weight: val } : v));
                            setEditIdx(null);
                          }
                          if (e.key === "Escape") setEditIdx(null);
                        }}
                        onBlur={e => {
                          const val = parseFloat(e.target.value) || 0;
                          setWeights(p => p.map((v, i) => i === exIdx ? { ...v, weight: val } : v));
                          setEditIdx(null);
                        }}
                        style={{ width: 64, background: "none", border: "none", borderBottom: `1px solid ${RED}`, color: RED, fontSize: 17, fontWeight: 700, textAlign: "center", outline: "none" }}
                      />
                      <span style={{ color: GREY, fontSize: 13 }}>kg</span>
                    </div>
                  ) : (
                    <span onClick={() => setEditIdx(exIdx)} style={{ color: RED, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                      {w.sets}×{w.reps} {w.weight}kg ›
                    </span>
                  )
                ) : (
                  <span style={{ color: RED, fontSize: 14, fontWeight: 600 }}>{fmtWeight(exWithWeight)}</span>
                )}
              </div>

              {w.failStreak > 0 && !banner && (
                <div style={{ color: "#ffb454", fontSize: 11, fontWeight: 600, marginBottom: 6 }}>
                  {w.failStreak}/{FAILS_BEFORE_DELOAD} fails at this weight
                </div>
              )}

              {banner && (
                <div style={{
                  color: banner.type === "progress" ? GREEN : banner.type === "deload" ? "#ff6b6b" : "#ffb454",
                  fontSize: 12, fontWeight: 600, marginBottom: 8,
                }}>
                  {banner.text}
                </div>
              )}

              {warmupSets.length > 0 && (
                <div style={{ marginBottom: 10, marginTop: 8 }}>
                  <div style={{ color: ORANGE, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 6 }}>
                    Warmup
                  </div>
                  {warmupSets.map((ws, j) => (
                    <div key={j} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
                      <CircleBtn
                        target={ws.reps}
                        achieved={warmupDone[`${exIdx}-${j}-0`] ? ws.reps : undefined}
                        onTap={() => toggleWarmup(exIdx, j, 0)}
                        size={40}
                        accent={ORANGE}
                      />
                      <span style={{ color: GREY, fontSize: 13 }}>{ws.weight}kg — {ws.note}</span>
                    </div>
                  ))}
                  <div style={{ color: WHITE, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", marginTop: 10, marginBottom: 6 }}>
                    Working Sets
                  </div>
                </div>
              )}

              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 6 }}>
                {Array.from({ length: w.sets }).map((_, sIdx) => (
                  <CircleBtn key={sIdx}
                    target={w.reps}
                    achieved={done[exIdx][sIdx]}
                    onTap={() => toggleSet(exIdx, sIdx)}
                  />
                ))}
                {w.sets > 1 && (
                  <div onClick={() => adjustSets(exIdx, -1)} style={{
                    width: 46, height: 46, borderRadius: "50%", background: "#2c2c2e",
                    border: `1.5px solid ${DIM}`, display: "flex", alignItems: "center",
                    justifyContent: "center", cursor: "pointer", flexShrink: 0,
                  }}>
                    <span style={{ color: GREY, fontSize: 22, fontWeight: 400, lineHeight: 1 }}>−</span>
                  </div>
                )}
                <div onClick={() => adjustSets(exIdx, 1)} style={{
                  width: 46, height: 46, borderRadius: "50%", background: "#2c2c2e",
                  border: `1.5px solid ${DIM}`, display: "flex", alignItems: "center",
                  justifyContent: "center", cursor: "pointer", flexShrink: 0,
                }}>
                  <span style={{ color: GREY, fontSize: 22, fontWeight: 400, lineHeight: 1 }}>+</span>
                </div>
              </div>
              <div style={{ color: GREY, fontSize: 11, marginBottom: 10 }}>
                Tap a circle for a full set, tap again to dial down reps if you failed
              </div>

              {isBarbell && (
                <div style={{ background: "#111", borderRadius: 10, padding: "10px 12px", marginBottom: 4 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 8, gap: 2 }}>
                    <div style={{ width: 6, height: 8, background: "#555", borderRadius: 1 }} />
                    {[...plates].reverse().flatMap((p, i) =>
                      Array.from({ length: p.count }).map((_, j) => (
                        <div key={`l${i}${j}`} style={{ width: 8, height: 20 + p.weight * 0.5, background: PLATE_COLORS[p.weight] || "#aaa", borderRadius: 2 }} />
                      ))
                    )}
                    <div style={{ width: 40, height: 8, background: "#555", borderRadius: 3, margin: "0 3px" }} />
                    {plates.flatMap((p, i) =>
                      Array.from({ length: p.count }).map((_, j) => (
                        <div key={`r${i}${j}`} style={{ width: 8, height: 20 + p.weight * 0.5, background: PLATE_COLORS[p.weight] || "#aaa", borderRadius: 2 }} />
                      ))
                    )}
                    <div style={{ width: 6, height: 8, background: "#555", borderRadius: 1 }} />
                  </div>
                  {plates.length === 0 ? (
                    <div style={{ color: GREY, fontSize: 12, textAlign: "center" }}>Bar only — {BARBELL_WEIGHT}kg</div>
                  ) : (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center" }}>
                      {plates.map((p, i) => (
                        <div key={i} style={{ display: "flex", alignItems: "center", gap: 4, background: "#1a1a1a", borderRadius: 6, padding: "4px 8px" }}>
                          <div style={{ width: 8, height: 8, borderRadius: 2, background: PLATE_COLORS[p.weight] || "#aaa" }} />
                          <span style={{ color: WHITE, fontSize: 12, fontWeight: 600 }}>{p.weight}kg</span>
                          <span style={{ color: GREY, fontSize: 11 }}>×{p.count}</span>
                        </div>
                      ))}
                      <div style={{ display: "flex", alignItems: "center", gap: 4, background: "#1a1a1a", borderRadius: 6, padding: "4px 8px" }}>
                        <span style={{ color: GREY, fontSize: 11 }}>bar {BARBELL_WEIGHT}kg</span>
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div style={{ borderBottom: `1px solid ${DIM}`, marginTop: 8 }} />
            </div>
          );
        })}
      </div>

      {showTimer && <RestTimer onDismiss={() => setShowTimer(false)} />}
      {plankRun && (
        <PlankTimer
          seconds={plankRun.seconds}
          exName={prog.exercises[plankRun.exIdx].name}
          onComplete={completePlankSet}
          onCancel={() => setPlankRun(null)}
        />
      )}
    </div>
  );
}

// ── Home Screen ───────────────────────────────────────────────────────────────
function HomeScreen({ programs, onStart }) {
  const [expanded, setExpanded] = useState(null);
  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "0 0 20px" }}>
      {SCHEDULE.map((s, i) => {
        const prog = programs[s.key];
        const preview = prog.exercises.slice(0, 3);
        const extra   = prog.exercises.length - 3;
        const isOpen  = expanded === i;
        return (
          <div key={i} style={{ background: CARD, borderRadius: 14, margin: "12px 16px 0", padding: "14px 16px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
              <span style={{ color: GREY, fontSize: 14 }}>{prog.name}</span>
              <span style={{ color: GREY, fontSize: 14 }}>{s.label}</span>
            </div>
            {(isOpen ? prog.exercises : preview).map((ex, j) => (
              <div key={j} style={{ display: "flex", justifyContent: "space-between", paddingBottom: 6 }}>
                <span style={{ color: WHITE, fontSize: 15 }}>{ex.name}</span>
                <span style={{ color: WHITE, fontSize: 15 }}>{fmtWeight(ex)}</span>
              </div>
            ))}
            {!isOpen && extra > 0 && (
              <div onClick={() => setExpanded(i)} style={{ color: GREY, fontSize: 13, marginTop: 4, cursor: "pointer" }}>
                +{extra} exercises
              </div>
            )}
            {isOpen && (
              <div onClick={() => setExpanded(null)} style={{ color: GREY, fontSize: 13, marginTop: 4, cursor: "pointer" }}>
                Show less
              </div>
            )}
            <button onClick={() => onStart(s.key)} style={{
              width: "100%", marginTop: 14,
              background: i === 0 ? RED : "transparent",
              border: i === 0 ? "none" : `1px solid ${RED}`,
              borderRadius: 28, padding: "13px 0", color: i === 0 ? WHITE : RED,
              fontSize: 16, fontWeight: 700, cursor: "pointer",
            }}>
              {i === 0 ? "Start Workout" : "Start"}
            </button>
          </div>
        );
      })}
    </div>
  );
}

// ── History Screen ────────────────────────────────────────────────────────────
function HistoryScreen({ history }) {
  const [expanded, setExpanded] = useState(null);
  if (history.length === 0) {
    return (
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <span style={{ color: GREY, fontSize: 14 }}>No workouts logged yet</span>
      </div>
    );
  }
  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "0 0 20px" }}>
      <div style={{ color: GREY, fontSize: 13, padding: "16px 16px 4px", textTransform: "uppercase", letterSpacing: "0.06em" }}>Past workouts</div>
      {history.map((h, i) => {
        const preview = h.exercises.slice(0, 3);
        const extra = h.exercises.length - 3;
        return (
          <div key={i} style={{ background: CARD, borderRadius: 14, margin: "8px 16px 0", padding: "14px 16px", cursor: "pointer" }}
            onClick={() => setExpanded(expanded === i ? null : i)}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ color: GREY, fontSize: 14 }}>{h.progName}</span>
              <span style={{ color: GREY, fontSize: 14 }}>{h.date}</span>
            </div>
            {(expanded === i ? h.exercises : preview).map((ex, j) => (
              <div key={j} style={{ display: "flex", justifyContent: "space-between", paddingBottom: 5 }}>
                <span style={{ color: WHITE, fontSize: 15 }}>
                  {ex.name}
                  {ex.success === true && <span style={{ color: GREEN }}> ✓</span>}
                  {ex.success === false && <span style={{ color: "#ffb454" }}> !</span>}
                </span>
                <span style={{ color: WHITE, fontSize: 15 }}>{fmtWeight(ex)}</span>
              </div>
            ))}
            {expanded !== i && extra > 0 && <div style={{ color: GREY, fontSize: 13, marginTop: 4 }}>+{extra} exercises</div>}
          </div>
        );
      })}
    </div>
  );
}

// ── Progress Screen ───────────────────────────────────────────────────────────
function ProgressScreen({ history }) {
  const [selected, setSelected] = useState(null);

  const liftMap = {};
  [...history].reverse().forEach(h => {
    h.exercises.forEach(ex => {
      if (ex.unit) return;
      if (!liftMap[ex.name]) liftMap[ex.name] = [];
      liftMap[ex.name].push(ex.weight);
    });
  });
  const lifts = Object.entries(liftMap).map(([name, sessions]) => ({ name, sessions }));

  if (lifts.length === 0) {
    return (
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <span style={{ color: GREY, fontSize: 14 }}>Complete a workout to see progress</span>
      </div>
    );
  }

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "0 0 20px" }}>
      <div style={{ color: GREY, fontSize: 13, padding: "16px 16px 4px", textTransform: "uppercase", letterSpacing: "0.06em" }}>Lift progress</div>
      {lifts.map((l, i) => {
        const max  = Math.max(...l.sessions);
        const last = l.sessions[l.sessions.length - 1];
        const gain = Math.round((last - l.sessions[0]) * 100) / 100;
        const isOpen = selected === i;
        return (
          <div key={i} style={{ background: CARD, borderRadius: 14, margin: "8px 16px 0", padding: "14px 16px", cursor: "pointer" }}
            onClick={() => setSelected(isOpen ? null : i)}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ color: WHITE, fontSize: 15, fontWeight: 600 }}>{l.name}</span>
              <span style={{ color: RED, fontSize: 15, fontWeight: 700 }}>{last} kg ›</span>
            </div>
            {isOpen && (
              <div style={{ marginTop: 12 }}>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 60, marginBottom: 10 }}>
                  {l.sessions.map((w, j) => (
                    <div key={j} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                      <span style={{ color: GREY, fontSize: 9 }}>{w}</span>
                      <div style={{ width: "100%", background: j === l.sessions.length - 1 ? RED : DIM, borderRadius: 3, height: `${Math.round((w / max) * 48)}px` }} />
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ color: GREY, fontSize: 13 }}>Personal best</span>
                  <span style={{ color: WHITE, fontSize: 13, fontWeight: 700 }}>{max} kg</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
                  <span style={{ color: GREY, fontSize: 13 }}>Total gained</span>
                  <span style={{ color: gain >= 0 ? GREEN : RED, fontSize: 13, fontWeight: 700 }}>+{gain} kg</span>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Programs Screen ───────────────────────────────────────────────────────────
function ProgramsScreen({ programs }) {
  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px" }}>
      <div style={{ color: GREY, fontSize: 13, marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.06em" }}>My Programs</div>
      {Object.entries(programs).map(([key, prog]) => (
        <div key={key} style={{ background: CARD, borderRadius: 14, padding: "14px 16px", marginBottom: 10 }}>
          <div style={{ color: WHITE, fontSize: 16, fontWeight: 700, marginBottom: 8 }}>{prog.name}</div>
          {prog.exercises.map((ex, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", paddingBottom: 5 }}>
              <span style={{ color: GREY, fontSize: 14 }}>{ex.name}</span>
              <span style={{ color: RED, fontSize: 14, fontWeight: 600 }}>{fmtWeight(ex)}</span>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

// ── Settings Screen ───────────────────────────────────────────────────────────
function SettingsScreen({ onReset }) {
  const rows = [
    { label: "Units",          value: "kg"                         },
    { label: "Rest Timer",     value: "2:00 min"                   },
    { label: "Progression",    value: `+${PROGRESSION_INCREMENT} kg / session` },
    { label: "Deload",         value: `-10% after ${FAILS_BEFORE_DELOAD} fails` },
    { label: "Plates",         value: "1.25 · 2.5 · 5 · 10 · 15 · 20 · 25" },
    { label: "Barbell Weight", value: `${BARBELL_WEIGHT} kg`       },
  ];
  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px" }}>
      <div style={{ color: GREY, fontSize: 13, marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.06em" }}>Settings</div>
      <div style={{ background: CARD, borderRadius: 14, overflow: "hidden" }}>
        {rows.map((r, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 16px", borderBottom: i < rows.length - 1 ? `1px solid ${DIM}` : "none" }}>
            <span style={{ color: WHITE, fontSize: 15 }}>{r.label}</span>
            <span style={{ color: GREY, fontSize: 14 }}>{r.value}</span>
          </div>
        ))}
      </div>
      <button onClick={onReset} style={{
        width: "100%", marginTop: 20, background: "transparent",
        border: `1px solid ${RED}`, borderRadius: 12, padding: "12px 0",
        color: RED, fontSize: 14, fontWeight: 600, cursor: "pointer",
      }}>Reset All Data</button>
      <div style={{ color: GREY, fontSize: 12, textAlign: "center", marginTop: 16 }}>StrongLifts Clone · v1.3</div>
    </div>
  );
}

// ── Bottom Nav ────────────────────────────────────────────────────────────────
const NAV = [
  { id: "home",     label: "Home",     icon: "⌂" },
  { id: "programs", label: "Programs", icon: "☰" },
  { id: "history",  label: "History",  icon: "◷" },
  { id: "progress", label: "Progress", icon: "↗" },
  { id: "settings", label: "Settings", icon: "⚙" },
];

// ── Root ──────────────────────────────────────────────────────────────────────
function App() {
  const [loaded, setLoaded]               = useState(false);
  const [programs, setPrograms]           = useState(DEFAULT_PROGRAMS);
  const [history, setHistory]             = useState([]);
  const [screen, setScreen]               = useState("home");
  const [activeWorkout, setActiveWorkout] = useState(null);
  const [prevScreen, setPrevScreen]       = useState("home");
  const pendingWeights = useRef(null);

  useEffect(() => {
    const saved = loadState();
    if (saved) {
      if (saved.programs) setPrograms(saved.programs);
      if (saved.history) setHistory(saved.history);
    }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    saveState({ programs, history });
  }, [programs, history, loaded]);

  function startWorkout(key) {
    setPrevScreen(screen);
    setActiveWorkout(key);
    setScreen("active");
  }

  function handleWeightsChange(progKey, weights, done) {
    pendingWeights.current = { progKey, weights, done };
  }

  function finishWorkout() {
    if (pendingWeights.current && pendingWeights.current.progKey === activeWorkout) {
      const { weights, done } = pendingWeights.current;
      setPrograms(prev => {
        const next = { ...prev };
        const prog = next[activeWorkout];
        next[activeWorkout] = {
          ...prog,
          exercises: prog.exercises.map((ex, i) => ({
            ...ex,
            weight: weights[i].weight,
            sets: weights[i].sets,
            reps: weights[i].reps,
            failStreak: weights[i].failStreak || 0,
          })),
        };
        return next;
      });

      const prog = programs[activeWorkout];
      const loggedExercises = prog.exercises.map((ex, i) => {
        const attempts = done[i] || {};
        const attemptedCount = Object.keys(attempts).length;
        const allFull = attemptedCount > 0 && Object.values(attempts).every(r => r >= weights[i].reps);
        return {
          ...ex,
          weight: weights[i].weight,
          sets: weights[i].sets,
          reps: weights[i].reps,
          attempted: attemptedCount,
          success: attemptedCount > 0 ? allFull : null,
        };
      });
      setHistory(prev => [{
        progKey: activeWorkout,
        progName: prog.name,
        date: new Date().toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }),
        exercises: loggedExercises,
      }, ...prev]);
    }
    pendingWeights.current = null;
    setActiveWorkout(null);
    setScreen("home");
  }

  function goBack() {
    setScreen(prevScreen);
  }

  function navigate(id) {
    if (id === "home" && activeWorkout) setScreen("active");
    else setScreen(id);
  }

  function handleReset() {
    setPrograms(DEFAULT_PROGRAMS);
    setHistory([]);
    setActiveWorkout(null);
    setScreen("home");
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  const isActive = screen === "active";
  const navItems = NAV.map(n =>
    n.id === "home" && activeWorkout ? { ...n, label: "Workout", icon: "💪" } : n
  );

  if (!loaded) {
    return (
      <div style={{ background: BG, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <span style={{ color: GREY, fontSize: 14 }}>Loading…</span>
      </div>
    );
  }

  return (
    <div style={{
      background: BG, minHeight: "100vh", maxWidth: 430, margin: "0 auto",
      display: "flex", flexDirection: "column",
      fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif",
    }}>
      {!isActive && (
        <div style={{ background: CARD, padding: "14px 20px 10px", textAlign: "center" }}>
          <span style={{ color: WHITE, fontSize: 18, fontWeight: 700 }}>StrongLifts</span>
        </div>
      )}

      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <div style={{ display: isActive ? "flex" : "none", flexDirection: "column", flex: 1, overflow: "hidden" }}>
          {activeWorkout && (
            <WorkoutScreen
              progKey={activeWorkout}
              programs={programs}
              onFinish={finishWorkout}
              onBack={goBack}
              onWeightsChange={handleWeightsChange}
            />
          )}
        </div>

        {!isActive && screen === "home"     && <HomeScreen programs={programs} onStart={startWorkout} />}
        {!isActive && screen === "programs" && <ProgramsScreen programs={programs} />}
        {!isActive && screen === "history"  && <HistoryScreen history={history} />}
        {!isActive && screen === "progress" && <ProgressScreen history={history} />}
        {!isActive && screen === "settings" && <SettingsScreen onReset={handleReset} />}
      </div>

      <div style={{ background: CARD, borderTop: `1px solid ${DIM}`, display: "flex", justifyContent: "space-around", padding: "8px 0 12px", flexShrink: 0 }}>
        {navItems.map(n => {
          const isSelected = isActive ? n.id === "home" : screen === n.id;
          return (
            <button key={n.id} onClick={() => navigate(n.id)} style={{
              background: "none", border: "none", cursor: "pointer",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
              color: isSelected ? RED : GREY,
            }}>
              <span style={{ fontSize: 20 }}>{n.icon}</span>
              <span style={{ fontSize: 10, fontWeight: isSelected ? 700 : 400 }}>{n.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
