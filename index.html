// ── Warmup calculator ─────────────────────────────────────────────────────────
// Generates progressive warmup sets from bar up to working weight.
// The closer the working weight is to the bar, the fewer steps.
function calcWarmups(workingWeight) {
  const round = (w) => Math.round(w / 2.5) * 2.5;
  const bar   = BARBELL_WEIGHT;

  // If working weight is bar or very close, no warmup needed
  if (workingWeight <= bar + 2.5) return [];

  const steps = [];

  // Always start with bar × 10 (technique focus)
  steps.push({ pct: 0, weight: bar, reps: 10, note: "Bar only — technique focus" });

  // Calculate how many intermediate steps based on gap from bar to working weight
  const gap = workingWeight - bar;

  if (gap > 10) {
    // ~40% of working weight
    const w40 = round(workingWeight * 0.40);
    if (w40 > bar && w40 < workingWeight) {
      steps.push({ pct: 40, weight: w40, reps: 8, note: "Light — build groove" });
    }
  }

  if (gap > 20) {
    // ~60%
    const w60 = round(workingWeight * 0.60);
    if (w60 > bar && w60 < workingWeight) {
      steps.push({ pct: 60, weight: w60, reps: 5, note: "Moderate — add load" });
    }
  }

  if (gap > 15) {
    // ~80%
    const w80 = round(workingWeight * 0.80);
    if (w80 > bar && w80 < workingWeight) {
      steps.push({ pct: 80, weight: w80, reps: 3, note: "Heavy — prime CNS" });
    }
  }

  if (gap > 25) {
    // ~90%
    const w90 = round(workingWeight * 0.90);
    if (w90 > bar && w90 < workingWeight) {
      steps.push({ pct: 90, weight: w90, reps: 2, note: "Near max — final prep" });
    }
  }

  // Deduplicate weights that rounded to the same value
  const seen = new Set();
  return steps.filter(s => {
    if (seen.has(s.weight)) return false;
    seen.add(s.weight);
    return true;
  });
}

// ── Plate calculator ──────────────────────────────────────────────────────────
// Returns array of { weight, count } per side
function calcPlates(totalKg) {
  const perSide = (totalKg - BARBELL_WEIGHT) / 2;
  if (perSide <= 0) return [];
  let remaining = perSide;
  const result = [];
  for (const p of AVAILABLE_PLATES) {
    if (remaining <= 0) break;
    const count = Math.floor(remaining / p);
    if (count > 0) {
      result.push({ weight: p, count });
      remaining = Math.round((remaining - p * count) * 1000) / 1000;
    }
  }
  return result;
}

// ── Web Audio bell ────────────────────────────────────────────────────────────
// Unlock audio context on first user interaction (required on Android/iOS)
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
document.addEventListener("touchstart", () => { try { getAudioCtx(); } catch(e){} }, { once: true });
document.addEventListener("click",      () => { try { getAudioCtx(); } catch(e){} }, { once: true });

function playBell() {
  try {
    const ctx = getAudioCtx();
    [[880, 0.6], [1108, 0.3], [1320, 0.15]].forEach(([freq, gain], i) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(gain, ctx.currentTime + i * 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.5);
      osc.start(ctx.currentTime + i * 0.01);
      osc.stop(ctx.currentTime + 2.6);
    });
  } catch (e) { /* silent fail */ }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtWeight(ex) {
  if (ex.unit === "sec") return `${ex.sets}×${ex.reps}sec`;
  if (ex.weight === 0)   return `${ex.sets}×${ex.reps}`;
  return `${ex.sets}×${ex.reps} ${ex.weight}kg`;
}

function fmtTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, "0");
  const sec = (s % 60).toString().padStart(2, "0");
  return `${m}:${sec}`;
}

    timer.current = setTimeout(() => { onLongPress(); }, 600);
  }
  function endPress() { clearTimeout(timer.current); }

  return (
    <div
      onClick={onClick}
      onMouseDown={startPress} onMouseUp={endPress} onMouseLeave={endPress}

}

// ── Rest Timer overlay ────────────────────────────────────────────────────────
const REST_SECS = 120;

function RestTimer({ onDismiss }) {
  const [secs, setSecs] = useState(REST_SECS);
  const [ringing, setRinging] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    intervalRef.current = setInterval(() => {
      setSecs(s => {
        if (s <= 1) {
          clearInterval(intervalRef.current);
          setRinging(true);
          playBell();
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, []);

  const pct = ((REST_SECS - secs) / REST_SECS) * 100;
  const r = 54;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.88)",
      display: "flex", flexDirection: "column", alignItems: "center",
      justifyContent: "center", zIndex: 100,
    }}>
      <div style={{ color: GREY, fontSize: 13, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 24 }}>
        {ringing ? "Rest over!" : "Rest"}
      </div>

      {/* SVG ring */}
      <svg width={130} height={130} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={65} cy={65} r={r} fill="none" stroke={DIM} strokeWidth={6} />
        <circle cx={65} cy={65} r={r} fill="none"
          stroke={ringing ? GREEN : RED} strokeWidth={6}
          strokeDasharray={`${dash} ${circ}`}
          strokeLinecap="round"
          style={{ transition: "stroke-dasharray 0.9s linear" }}
        />
      </svg>
      <div style={{
        position: "absolute", fontSize: 32, fontWeight: 700,
        color: ringing ? GREEN : WHITE, fontVariantNumeric: "tabular-nums",
      }}>
        {fmtTime(secs)}
      </div>

      <div style={{ marginTop: 36, display: "flex", gap: 14 }}>
        <button onClick={() => { setSecs(s => s + 30); setRinging(false); }} style={{
          background: DIM, border: "none", borderRadius: 22, padding: "10px 20px",
          color: WHITE, fontSize: 14, cursor: "pointer",
        }}>+30s</button>
        <button onClick={onDismiss} style={{
          background: RED, border: "none", borderRadius: 22, padding: "10px 24px",
          color: WHITE, fontSize: 14, fontWeight: 700, cursor: "pointer",
        }}>Skip</button>
      </div>
    </div>
  );
}

// ── Set Timer (for timed exercises like Planks) ───────────────────────────────
function SetTimer({ seconds, label, onComplete, onDismiss }) {
  const [secs, setSecs] = useState(seconds);
  const [running, setRunning] = useState(false);
  const [done, setDone]       = useState(false);
  const intervalRef           = useRef(null);

  function start() {
    if (running || done) return;
    setRunning(true);
    intervalRef.current = setInterval(() => {
      setSecs(s => {
        if (s <= 1) {
          clearInterval(intervalRef.current);
          setRunning(false);
          setDone(true);
          playBell();
          return 0;
        }
        return s - 1;
      });
    }, 1000);
  }

  useEffect(() => () => clearInterval(intervalRef.current), []);

  const pct  = ((seconds - secs) / seconds) * 100;
  const r    = 54;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.92)",
      display: "flex", flexDirection: "column", alignItems: "center",
      justifyContent: "center", zIndex: 200,
    }}>
      <div style={{ color: GREY, fontSize: 13, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 8 }}>{label}</div>
      <div style={{ color: done ? GREEN : GREY, fontSize: 12, marginBottom: 20 }}>
        {done ? "Done! Great hold! 💪" : running ? "Hold it..." : "Tap to start"}
      </div>

      {/* Ring */}
      <div style={{ position: "relative", width: 130, height: 130, cursor: done ? "default" : "pointer" }} onClick={!done ? start : undefined}>
        <svg width={130} height={130} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={65} cy={65} r={r} fill="none" stroke={DIM} strokeWidth={6} />
          <circle cx={65} cy={65} r={r} fill="none"
            stroke={done ? GREEN : running ? RED : GREY}
            strokeWidth={6}
            strokeDasharray={`${dash} ${circ}`}
            strokeLinecap="round"
            style={{ transition: "stroke-dasharray 0.9s linear" }}
          />
        </svg>
        <div style={{
          position: "absolute", inset: 0, display: "flex", alignItems: "center",
          justifyContent: "center", fontSize: 32, fontWeight: 700,
          color: done ? GREEN : WHITE, fontVariantNumeric: "tabular-nums",
        }}>
          {fmtTime(secs)}
        </div>
      </div>

      <div style={{ marginTop: 36, display: "flex", gap: 14 }}>
        {done ? (
          <button onClick={onComplete} style={{
            background: GREEN, border: "none", borderRadius: 22,
            padding: "12px 32px", color: WHITE, fontSize: 15, fontWeight: 700, cursor: "pointer"
          }}>Mark Complete ✓</button>
        ) : (
          <>
            {!running && (
              <button onClick={start} style={{
                background: RED, border: "none", borderRadius: 22,
                padding: "12px 28px", color: WHITE, fontSize: 15, fontWeight: 700, cursor: "pointer"
              }}>Start</button>
            )}
            <button onClick={() => { clearInterval(intervalRef.current); onComplete(); }} style={{
              background: DIM, border: "none", borderRadius: 22,
              padding: "12px 20px", color: WHITE, fontSize: 14, fontWeight: 600, cursor: "pointer"
            }}>Skip</button>
            <button onClick={onDismiss} style={{
              background: "none", border: `1px solid ${DIM}`, borderRadius: 22,
              padding: "12px 20px", color: GREY, fontSize: 14, cursor: "pointer"
            }}>Cancel</button>
          </>
        )}
      </div>
    </div>
  );
}

function WorkoutScreen({ progKey, initialWeights, onFinish, onBack }) {
  const prog = PROGRAMS[progKey];

  const [done, setDone] = useState(() => {
    const d = {};
    prog.exercises.forEach((_, i) => { d[i] = new Set(); });
    return d;
  });
  const [weights, setWeights] = useState(() =>
    initialWeights
      ? initialWeights.map(w => ({ ...w }))
      : prog.exercises.map(ex => ({ weight: ex.weight, sets: ex.sets, reps: ex.reps }))
  );
  const [warmupDone, setWarmupDone] = useState({});
  const [tab, setTab]             = useState("workout");
  const [showTimer, setShowTimer] = useState(false);
  // Track actual reps per set: { "exIdx-sIdx": number }
  const [actualReps, setActualReps] = useState({});
  const [editingReps, setEditingReps] = useState(null); // "exIdx-sIdx"
  const [plateEx, setPlateEx]     = useState(null);
  const [editIdx, setEditIdx]     = useState(null);
  const [setTimerTarget, setSetTimerTarget] = useState(null); // { exIdx, sIdx, seconds, label }

  function adjustWeight(exIdx, delta) {}
  function adjustSets(exIdx, delta) {}
  function adjustReps(exIdx, delta) {}

  function toggleWarmup(exIdx, wsIdx, sIdx) {
    const key = `${exIdx}-${wsIdx}-${sIdx}`;
    setWarmupDone(prev => {
      const next = { ...prev };
      if (next[key]) {
        delete next[key];
      } else {
        next[key] = true;
        setShowTimer(true);
      }
      return next;
    });
  }

  function toggleSet(exIdx, setIdx) {
    setDone(prev => {
      const copy = { ...prev };
      const s = new Set(copy[exIdx]);
      const wasEmpty = s.size === 0 || !s.has(setIdx);
      wasEmpty ? s.add(setIdx) : s.delete(setIdx);
      copy[exIdx] = s;
      // start rest timer when marking a set complete
      if (wasEmpty) setShowTimer(true);
      return copy;
    });
  }

  const totalSets     = prog.exercises.reduce((a, e) => a + e.sets, 0);
  const completedSets = Object.values(done).reduce((a, s) => a + s.size, 0);
  const pct           = Math.round((completedSets / totalSets) * 100);

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", position: "relative" }}>
      {/* top bar */}
      <div style={{ background: CARD, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>

        <button onClick={() => onFinish(progKey, weights, done)} style={{ background: "none", border: "none", color: RED, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>Finish</button>
      </div>

      {/* tabs */}
      <div style={{ display: "flex", background: CARD }}>
        {["workout", "warmup"].map(t => (
          <div key={t} onClick={() => setTab(t)} style={{
            flex: 1, textAlign: "center", padding: "10px 0",
            color: tab === t ? WHITE : GREY,
            fontWeight: tab === t ? 700 : 400, fontSize: 15, cursor: "pointer",
            borderBottom: tab === t ? `2px solid ${RED}` : `2px solid transparent`,
          }}>{t.charAt(0).toUpperCase() + t.slice(1)}</div>
        ))}
      </div>

      {/* progress bar */}
      <div style={{ background: DIM, height: 3 }}>
        <div style={{ background: RED, height: 3, width: `${pct}%`, transition: "width 0.3s" }} />
      </div>

      {/* ── WORKOUT TAB ── */}
      {tab === "workout" && (
        <div style={{ flex: 1, overflowY: "auto", padding: "0 0 16px" }}>
          {prog.exercises.map((ex, exIdx) => {
            const w = weights[exIdx];
            const exWithWeight = { ...ex, ...w };
            const isEditing = editIdx === exIdx;
            const plates = (!ex.unit && w.weight > 0) ? calcPlates(w.weight) : [];
            const isBarbell = !ex.unit && w.weight >= BARBELL_WEIGHT;

            return (
              <div key={exIdx} style={{ padding: "16px 16px 0" }}>
                {/* Row 1: name + editable weight */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                  <span style={{ color: WHITE, fontSize: 16, fontWeight: 500 }}>{ex.name}</span>

                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    {!ex.unit ? (
                      isEditing ? (
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }} onClick={e => e.stopPropagation()}>
                          <input
                            autoFocus
                            type="text"
                            inputMode="decimal"
                            defaultValue={w.weight}
                            onKeyDown={e => {
                              if (e.key === "Enter") {
                                const val = parseFloat(e.target.value) || 0;
                                setWeights(p => p.map((v,i) => i===exIdx ? {...v, weight: val} : v));
                                setEditIdx(null);
                              }
                              if (e.key === "Escape") setEditIdx(null);
                            }}
                            onBlur={e => {
                              const val = parseFloat(e.target.value) || 0;
                              setWeights(p => p.map((v,i) => i===exIdx ? {...v, weight: val} : v));
                              setEditIdx(null);
                            }}
                            style={{ width: 64, background: "none", border: "none", borderBottom: `1px solid ${RED}`, color: RED, fontSize: 17, fontWeight: 700, textAlign: "center", outline: "none" }}
                          />
                          <span style={{ color: GREY, fontSize: 13 }}>kg</span>
                        </div>
                      ) : (
                        <span onClick={() => setEditIdx(exIdx)} style={{ color: RED, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
                          {w.sets}×{w.reps} {w.weight}kg ›
                        </span>
                      )
                    ) : (
                      <span style={{ color: RED, fontSize: 14, fontWeight: 600 }}>{fmtWeight(exWithWeight)}</span>
                    )}
                  </div>
                </div>

                {/* Set circles */}
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 12 }}>
                  {Array.from({ length: w.sets }).map((_, sIdx) => {
                    const repKey = `${exIdx}-${sIdx}`;
                    const isDone = done[exIdx].has(sIdx);
                    const actual = actualReps[repKey] ?? w.reps;
                    const fullReps = actual >= w.reps;

                    if (ex.unit === "sec") {
                      return (
                        <CircleBtn key={sIdx}
                          value={isDone ? "✓" : `${w.reps}s`}
                          done={isDone}
                          onClick={() => {
                            if (!isDone) setSetTimerTarget({ exIdx, sIdx, seconds: w.reps, label: ex.name });
                            else toggleSet(exIdx, sIdx);
                          }}
                        />
                      );
                    }

                    return (
                      <div key={sIdx} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                        <div
                          onClick={() => {
                            const repKey = `${exIdx}-${sIdx}`;
                            if (!isDone) {
                              // First tap — mark done at full reps, start rest timer
                              setActualReps(p => ({ ...p, [repKey]: w.reps }));
                              toggleSet(exIdx, sIdx);
                              setShowTimer(true);
                            } else {
                              // Subsequent taps — count down reps
                              const next = actual - 1;
                              if (next < 1) {
                                // Reached 0 — undo the set entirely
                                setActualReps(p => { const c = {...p}; delete c[repKey]; return c; });
                                toggleSet(exIdx, sIdx);
                              } else {
                                setActualReps(p => ({ ...p, [repKey]: next }));
                              }
                            }
                          }}
                          style={{
                            width: 48, height: 48, borderRadius: "50%",
                            background: isDone ? (fullReps ? GREEN : RED) : DIM,
                            display: "flex", alignItems: "center", justifyContent: "center",
                            cursor: "pointer", flexShrink: 0, transition: "background 0.15s", userSelect: "none",
                          }}>
                          <span style={{ color: isDone ? WHITE : GREY, fontSize: 15, fontWeight: 600 }}>
                            {isDone ? actual : w.reps}
                          </span>
                        </div>
                        {isDone && (
                          <span style={{ color: fullReps ? GREEN : RED, fontSize: 10, fontWeight: 700 }}>
                            {actual}/{w.reps}
                          </span>
                        )}
                      </div>
                    );
                  })}
                  {/* − button */}
                  {w.sets > 1 && (
                    <div onClick={() => {
                      setWeights(p => p.map((v,i) => i===exIdx ? {...v, sets: v.sets-1} : v));
                      setDone(prev => {
                        const copy = { ...prev };
                        const s = new Set([...copy[exIdx]].filter(x => x < w.sets - 1));
                        copy[exIdx] = s;
                        return copy;
                      });
                    }} style={{
                      width: 48, height: 48, borderRadius: "50%", background: "#2c2c2e",
                      border: `1.5px solid ${DIM}`, display: "flex", alignItems: "center",
                      justifyContent: "center", cursor: "pointer", flexShrink: 0,
                    }}>
                      <span style={{ color: GREY, fontSize: 22, fontWeight: 400, lineHeight: 1 }}>−</span>
                    </div>
                  )}
                  {/* + button */}
                  <div onClick={() => setWeights(p => p.map((v,i) => i===exIdx ? {...v, sets: v.sets+1} : v))}
                    style={{
                      width: 48, height: 48, borderRadius: "50%", background: "#2c2c2e",
                      border: `1.5px solid ${DIM}`, display: "flex", alignItems: "center",
                      justifyContent: "center", cursor: "pointer", flexShrink: 0,
                    }}>
                    <span style={{ color: GREY, fontSize: 22, fontWeight: 400, lineHeight: 1 }}>+</span>
                  </div>
                </div>

                {/* Inline plate calculator */}
                {isBarbell && (
                  <div style={{ background: "#111", borderRadius: 10, padding: "10px 12px", marginBottom: 4 }}>
                    {/* Visual barbell */}
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 8, gap: 2 }}>
                      <div style={{ width: 6, height: 8, background: "#555", borderRadius: 1 }} />
                      {[...plates].reverse().flatMap((p, i) =>
                        Array.from({ length: p.count }).map((_, j) => (
                          <div key={`l${i}${j}`} style={{ width: 8, height: 20 + p.weight * 0.5, background: PLATE_COLORS[p.weight] || "#aaa", borderRadius: 2 }} />
                        ))
                      )}
                      <div style={{ width: 40, height: 8, background: "#555", borderRadius: 3, margin: "0 3px" }} />
                      {plates.flatMap((p, i) =>
                        Array.from({ length: p.count }).map((_, j) => (
                          <div key={`r${i}${j}`} style={{ width: 8, height: 20 + p.weight * 0.5, background: PLATE_COLORS[p.weight] || "#aaa", borderRadius: 2 }} />
                        ))
                      )}
                      <div style={{ width: 6, height: 8, background: "#555", borderRadius: 1 }} />
                    </div>

                    {/* Plate list */}
                    {plates.length === 0 ? (
                      <div style={{ color: GREY, fontSize: 12, textAlign: "center" }}>Bar only — {BARBELL_WEIGHT}kg</div>
                    ) : (
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center" }}>
                        {plates.map((p, i) => (
                          <div key={i} style={{ display: "flex", alignItems: "center", gap: 4, background: "#1a1a1a", borderRadius: 6, padding: "4px 8px" }}>
                            <div style={{ width: 8, height: 8, borderRadius: 2, background: PLATE_COLORS[p.weight] || "#aaa" }} />
                            <span style={{ color: WHITE, fontSize: 12, fontWeight: 600 }}>{p.weight}kg</span>
                            <span style={{ color: GREY, fontSize: 11 }}>×{p.count}</span>
                          </div>
                        ))}
                        <div style={{ display: "flex", alignItems: "center", gap: 4, background: "#1a1a1a", borderRadius: 6, padding: "4px 8px" }}>
                          <span style={{ color: GREY, fontSize: 11 }}>bar {BARBELL_WEIGHT}kg</span>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                <div style={{ borderBottom: `1px solid ${DIM}`, marginTop: 8 }} />
              </div>
            );
          })}
          <div style={{ margin: "16px 16px 0", background: "#2c2c2e", borderRadius: 10, padding: "12px 16px", display: "flex", justifyContent: "space-between" }}>
            <span style={{ color: WHITE, fontSize: 15, fontWeight: 500 }}>Body Weight</span>
            <span style={{ color: RED, fontSize: 15, fontWeight: 700 }}>34kg</span>
          </div>
        </div>
      )}

      {/* ── WARMUP TAB ── */}
      {tab === "warmup" && (
        <div style={{ flex: 1, overflowY: "auto", padding: "0 0 24px" }}>
          {prog.exercises.map((ex, exIdx) => {
            const w = weights[exIdx];
            const isBarbell  = !ex.unit && w.weight >= BARBELL_WEIGHT;
            const warmupSets = isBarbell ? calcWarmups(w.weight) : [];
            const mobility   = MOBILITY_WARMUPS[ex.name] || [];
            if (warmupSets.length === 0 && mobility.length === 0) return null;

            return (
              <div key={exIdx} style={{ padding: "16px 16px 0" }}>
                {/* Exercise header — same style as workout tab */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                  <span style={{ color: WHITE, fontSize: 16, fontWeight: 500 }}>{ex.name}</span>
                  <span style={{ color: RED, fontSize: 14, fontWeight: 600 }}>Working: {w.weight}kg</span>
                </div>

                {/* Activation drills */}
                {mobility.length > 0 && (
                  <div style={{ marginBottom: 12 }}>
                    {mobility.map((drill, j) => (
                      <div key={j} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
                        <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#f97316", flexShrink: 0 }} />
                        <span style={{ color: GREY, fontSize: 13 }}>{drill}</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Warmup loading sets — circle buttons just like working sets */}
                {warmupSets.length > 0 && (
                  <div>
                    {warmupSets.map((ws, j) => (
                      <div key={j} style={{ marginBottom: 14 }}>
                        {/* Weight label above circles */}
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                          <span style={{ color: GREY, fontSize: 13 }}>{ws.note}</span>
                          <span style={{ color: RED, fontSize: 13, fontWeight: 600 }}>{ws.weight}kg × {ws.reps}</span>
                        </div>
                        {/* One circle per rep — same CircleBtn component */}
                        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                          {Array.from({ length: ws.sets || 1 }).map((_, sIdx) => (
                            <CircleBtn
                              key={sIdx}
                              value={ws.reps}
                              done={warmupDone[`${exIdx}-${j}-${sIdx}`] || false}
                              onClick={() => toggleWarmup(exIdx, j, sIdx)}
                              size={48}
                            />
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <div style={{ borderBottom: `1px solid ${DIM}`, marginTop: 4 }} />
              </div>
            );
          })}
        </div>
      )}

      {/* note/edit bar */}
      <div style={{ background: CARD, borderTop: `1px solid ${DIM}`, display: "flex", justifyContent: "space-between", padding: "12px 20px" }}>
        <span style={{ color: RED, fontSize: 15, fontWeight: 600 }}>Note</span>
        <span style={{ color: RED, fontSize: 15, fontWeight: 600 }}>Edit</span>
      </div>

      {/* Modals */}
      {showTimer && <RestTimer onDismiss={() => setShowTimer(false)} />}
      {plateEx   && <PlateModal exercise={plateEx} onClose={() => setPlateEx(null)} />}

      {setTimerTarget && (
        <SetTimer
          seconds={setTimerTarget.seconds}
          label={setTimerTarget.label}
          onComplete={() => {
            toggleSet(setTimerTarget.exIdx, setTimerTarget.sIdx);
            setSetTimerTarget(null);
            setShowTimer(true);
          }}
          onDismiss={() => setSetTimerTarget(null)}
        />
      )}
    </div>
  );
}

function HomeScreen({ onStart, schedule, programWeights }) {
  const [expanded, setExpanded] = useState(null);

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "0 0 20px" }}>
      {schedule.map((s, i) => {
        const prog   = PROGRAMS[s.key];
        const exWeights = programWeights ? programWeights[s.key] : null;
        const isOpen = expanded === i;
        const isToday = i === 0;

        return (
          <div key={i} style={{ background: CARD, borderRadius: 14, margin: "12px 16px 0", overflow: "hidden" }}>

            {/* Header row — tap to expand/collapse */}
            <div onClick={() => setExpanded(isOpen ? null : i)}
              style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 16px", cursor: "pointer" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                {isToday && (
                  <div style={{ background: RED, borderRadius: 6, padding: "2px 8px" }}>
                    <span style={{ color: WHITE, fontSize: 11, fontWeight: 700 }}>TODAY</span>
                  </div>
                )}
                <span style={{ color: WHITE, fontSize: 15, fontWeight: 600 }}>{prog.name}</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ color: GREY, fontSize: 13 }}>{s.label}</span>
                <span style={{ color: GREY, fontSize: 16 }}>{isOpen ? "▾" : "›"}</span>
              </div>
            </div>

            {/* Exercise list — only shown when expanded */}
            {isOpen && (
              <div style={{ padding: "0 16px 14px", borderTop: `1px solid ${DIM}` }}>
                {prog.exercises.map((ex, j) => {
                  const w = exWeights ? exWeights[j] : ex;
                  return (
                    <div key={j} style={{ display: "flex", justifyContent: "space-between", paddingTop: 10 }}>
                      <span style={{ color: GREY, fontSize: 14 }}>{ex.name}</span>
                      <span style={{ color: WHITE, fontSize: 14, fontWeight: 600 }}>{fmtWeight({ ...ex, ...w })}</span>
                    </div>
                  );
                })}
                <button onClick={() => onStart(s.key)} style={{
                  width: "100%", marginTop: 16,
                  background: isToday ? RED : "transparent",
                  border: isToday ? "none" : `1px solid ${RED}`,
                  borderRadius: 28, padding: "13px 0",
                  color: isToday ? WHITE : RED,
                  fontSize: 16, fontWeight: 700, cursor: "pointer",
                }}>
                  {isToday ? "Start Workout" : "Start"}
                </button>
              </div>
            )}

            {/* Collapsed state */}
            {!isOpen && (
              <div style={{ padding: "0 16px 14px" }}>
                <span style={{ color: GREY, fontSize: 13 }}>{prog.exercises.length} exercises</span>
                {isToday && (
                  <button onClick={() => onStart(s.key)} style={{
                    width: "100%", marginTop: 12,
                    background: RED, border: "none",
                    borderRadius: 28, padding: "13px 0",
                    color: WHITE, fontSize: 16, fontWeight: 700, cursor: "pointer",
                  }}>Start Workout</button>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── History Screen ────────────────────────────────────────────────────────────
function HistoryScreen({ history, onAddPast }) {
  const [expanded, setExpanded]   = useState(null);
  const [logging, setLogging]     = useState(false);
  const [logKey, setLogKey]       = useState("B");
  const [logDate, setLogDate]     = useState(() => {
    const d = new Date(); d.setDate(d.getDate() - 1);
    return d.toISOString().slice(0, 10);
  });
  const [logWeights, setLogWeights] = useState(() =>
    PROGRAMS["B"].exercises.map(ex => ({ ...ex }))
  );

  function changeLogKey(key) {
    setLogKey(key);
    setLogWeights(PROGRAMS[key].exercises.map(ex => ({ ...ex })));
  }

  function updateLogWeight(idx, val) {
    setLogWeights(prev => prev.map((ex, i) => i === idx ? { ...ex, weight: parseFloat(val) || 0 } : ex));
  }

  function saveLog() {
    const d = new Date(logDate);
    const dateStr = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    onAddPast({ key: logKey, date: dateStr, exercises: logWeights });
    setLogging(false);
  }

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "0 0 24px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 16px 4px" }}>
        <span style={{ color: GREY, fontSize: 13, textTransform: "uppercase", letterSpacing: "0.06em" }}>Past workouts</span>
        <button onClick={() => setLogging(!logging)} style={{
          background: logging ? DIM : RED, border: "none", borderRadius: 10,
          padding: "6px 14px", color: WHITE, fontSize: 13, fontWeight: 700, cursor: "pointer"
        }}>{logging ? "Cancel" : "+ Log past"}</button>
      </div>

      {/* Log past workout form */}
      {logging && (
        <div style={{ background: CARD, borderRadius: 14, margin: "8px 16px 0", padding: "16px" }}>
          <div style={{ color: WHITE, fontSize: 15, fontWeight: 700, marginBottom: 14 }}>Log Past Workout</div>

          {/* Workout type + date */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
            <div>
              <div style={{ color: GREY, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>Workout</div>
              <select value={logKey} onChange={e => changeLogKey(e.target.value)} style={{
                width: "100%", background: "#2c2c2e", border: "none", borderRadius: 8,
                padding: "10px", color: WHITE, fontSize: 14, outline: "none"
              }}>
                {Object.keys(PROGRAMS).map(k => <option key={k} value={k}>{PROGRAMS[k].name}</option>)}
              </select>
            </div>
            <div>
              <div style={{ color: GREY, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>Date</div>
              <input type="date" value={logDate} onChange={e => setLogDate(e.target.value)} style={{
                width: "100%", background: "#2c2c2e", border: "none", borderRadius: 8,
                padding: "10px", color: WHITE, fontSize: 14, outline: "none", boxSizing: "border-box"
              }} />
            </div>
          </div>

          {/* Per-exercise weight entry */}
          <div style={{ marginBottom: 14 }}>
            {logWeights.map((ex, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingBottom: 10, borderBottom: i < logWeights.length - 1 ? `1px solid ${DIM}` : "none", marginBottom: 10 }}>
                <span style={{ color: WHITE, fontSize: 14 }}>{ex.name}</span>
                {!ex.unit ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <input
                      type="text" inputMode="decimal"
                      defaultValue={ex.weight}
                      onBlur={e => updateLogWeight(i, e.target.value)}
                      style={{
                        width: 60, background: "#2c2c2e", border: "none",
                        borderBottom: `1px solid ${RED}`, borderRadius: 0,
                        color: RED, fontSize: 16, fontWeight: 700,
                        textAlign: "center", outline: "none", padding: "4px"
                      }} />
                    <span style={{ color: GREY, fontSize: 13 }}>kg</span>
                  </div>
                ) : (
                  <span style={{ color: GREY, fontSize: 13 }}>{fmtWeight(ex)}</span>
                )}
              </div>
            ))}
          </div>

          <button onClick={saveLog} style={{
            width: "100%", background: RED, border: "none", borderRadius: 12,
            padding: "14px", color: WHITE, fontSize: 15, fontWeight: 700, cursor: "pointer"
          }}>Save Workout</button>
        </div>
      )}

      {/* History list */}
      {history.length === 0 && !logging && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", padding: 40 }}>
          <span style={{ color: GREY, fontSize: 15 }}>No workouts yet. Log your first one above!</span>
        </div>
      )}
      {history.map((h, i) => {
        const prog = PROGRAMS[h.key];
        const preview = h.exercises.slice(0, 3);
        const extra = h.exercises.length - 3;
        return (
          <div key={i} style={{ background: CARD, borderRadius: 14, margin: "8px 16px 0", padding: "14px 16px", cursor: "pointer" }}
            onClick={() => setExpanded(expanded === i ? null : i)}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ color: WHITE, fontSize: 14, fontWeight: 600 }}>{prog.name}</span>
              <span style={{ color: GREY, fontSize: 14 }}>{h.date}</span>
            </div>
            {(expanded === i ? h.exercises : preview).map((ex, j) => (
              <div key={j} style={{ display: "flex", justifyContent: "space-between", paddingBottom: 5 }}>
                <span style={{ color: GREY, fontSize: 14 }}>{ex.name}</span>
                <span style={{ color: WHITE, fontSize: 14 }}>{fmtWeight(ex)}</span>
              </div>
            ))}
            {expanded !== i && extra > 0 && <div style={{ color: GREY, fontSize: 13, marginTop: 4 }}>+{extra} exercises</div>}
          </div>
        );
      })}
    </div>
  );
}

// ── Progress Screen ───────────────────────────────────────────────────────────
function ProgressScreen() {
  const lifts = [
    { name: "Squat",          sessions: [42.5, 45, 47.5, 50] },
    { name: "Bench Press",    sessions: [67.5, 70, 72.5]     },
    { name: "Deadlift",       sessions: [65, 70, 75]          },
    { name: "Overhead Press", sessions: [40, 42.5, 45]        },
    { name: "Barbell Row",    sessions: [72.5, 75, 77.5]     },
  ];
  const [selected, setSelected] = useState(null);
  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "0 0 20px" }}>
      <div style={{ color: GREY, fontSize: 13, padding: "16px 16px 4px", textTransform: "uppercase", letterSpacing: "0.06em" }}>Lift progress</div>
      {lifts.map((l, i) => {
        const max  = Math.max(...l.sessions);
        const last = l.sessions[l.sessions.length - 1];
        const gain = last - l.sessions[0];
        const isOpen = selected === i;
        return (
          <div key={i} style={{ background: CARD, borderRadius: 14, margin: "8px 16px 0", padding: "14px 16px", cursor: "pointer" }}
            onClick={() => setSelected(isOpen ? null : i)}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ color: WHITE, fontSize: 15, fontWeight: 600 }}>{l.name}</span>
              <span style={{ color: RED, fontSize: 15, fontWeight: 700 }}>{last} kg ›</span>
            </div>
            {isOpen && (
              <div style={{ marginTop: 12 }}>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 60, marginBottom: 10 }}>
                  {l.sessions.map((w, j) => (
                    <div key={j} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                      <span style={{ color: GREY, fontSize: 9 }}>{w}</span>
                      <div style={{ width: "100%", background: j === l.sessions.length - 1 ? RED : DIM, borderRadius: 3, height: `${Math.round((w / max) * 48)}px` }} />
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ color: GREY, fontSize: 13 }}>Personal best</span>
                  <span style={{ color: WHITE, fontSize: 13, fontWeight: 700 }}>{max} kg</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
                  <span style={{ color: GREY, fontSize: 13 }}>Total gained</span>
                  <span style={{ color: gain >= 0 ? GREEN : RED, fontSize: 13, fontWeight: 700 }}>+{gain} kg</span>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Programs Screen ───────────────────────────────────────────────────────────
function ProgramsScreen() {
  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px" }}>
      <div style={{ color: GREY, fontSize: 13, marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.06em" }}>My Programs</div>
      {Object.entries(PROGRAMS).map(([key, prog]) => (
        <div key={key} style={{ background: CARD, borderRadius: 14, padding: "14px 16px", marginBottom: 10 }}>
          <div style={{ color: WHITE, fontSize: 16, fontWeight: 700, marginBottom: 8 }}>{prog.name}</div>
          {prog.exercises.map((ex, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", paddingBottom: 5 }}>
              <span style={{ color: GREY, fontSize: 14 }}>{ex.name}</span>
              <span style={{ color: RED, fontSize: 14, fontWeight: 600 }}>{fmtWeight(ex)}</span>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

// ── Settings Screen ───────────────────────────────────────────────────────────
function SettingsScreen() {
  const rows = [
    { label: "Units",          value: "kg"                         },
    { label: "Rest Timer",     value: "2:00 min"                   },
    { label: "Body Weight",    value: "34 kg"                      },
    { label: "Plates",         value: "1.25 · 2.5 · 5 · 10 · 15 · 20 · 25" },
    { label: "Barbell Weight", value: `${BARBELL_WEIGHT} kg`       },
  ];
  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px" }}>
      <div style={{ color: GREY, fontSize: 13, marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.06em" }}>Settings</div>
      <div style={{ background: CARD, borderRadius: 14, overflow: "hidden" }}>
        {rows.map((r, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 16px", borderBottom: i < rows.length - 1 ? `1px solid ${DIM}` : "none" }}>
            <span style={{ color: WHITE, fontSize: 15 }}>{r.label}</span>
            <span style={{ color: GREY, fontSize: 14 }}>{r.value} ›</span>
          </div>
        ))}
      </div>
      <div style={{ color: GREY, fontSize: 12, textAlign: "center", marginTop: 24 }}>StrongLifts Clone · v1.1</div>
    </div>
  );
}

// ── Bottom Nav ────────────────────────────────────────────────────────────────
const NAV = [
  { id: "home",     label: "Home",     icon: "⌂" },
  { id: "programs", label: "Programs", icon: "☰" },
  { id: "history",  label: "History",  icon: "◷" },
  { id: "progress", label: "Progress", icon: "↗" },
  { id: "settings", label: "Settings", icon: "⚙" },
];

// ── Root ──────────────────────────────────────────────────────────────────────
const INITIAL_SCHEDULE = [
  { key: "B", label: "Today"       },
  { key: "C", label: "Sat, 13 Jun" },
  { key: "A", label: "Sun, 14 Jun" },
  { key: "C", label: "Tue, 16 Jun" },
  { key: "B", label: "Wed, 17 Jun" },
  { key: "A", label: "Fri, 19 Jun" },
  { key: "C", label: "Sun, 21 Jun" },
  { key: "B", label: "Tue, 23 Jun" },
];

const INITIAL_HISTORY = [
  { key: "C", date: "Sat, 13 Jun", exercises: PROGRAMS.C.exercises },
  { key: "A", date: "Sun, 14 Jun", exercises: PROGRAMS.A.exercises },
];

// ── localStorage helpers ──────────────────────────────────────────────────────
function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

function App() {
  const [screen, setScreen]               = useState("home");
  const [activeWorkout, setActiveWorkout] = useState(null);
  const [prevScreen, setPrevScreen]       = useState("home");

  const [schedule, setSchedule] = useState(() =>
    load("sl_schedule", INITIAL_SCHEDULE)
  );
  const [history, setHistory] = useState(() =>
    load("sl_history", INITIAL_HISTORY)
  );
  const [programWeights, setProgramWeights] = useState(() => {
    const fallback = {};
    Object.entries(PROGRAMS).forEach(([key, prog]) => {
      fallback[key] = prog.exercises.map(ex => ({ weight: ex.weight, sets: ex.sets, reps: ex.reps }));
    });
    return load("sl_weights", fallback);
  });

  // Save to localStorage whenever state changes
  useEffect(() => { save("sl_schedule", schedule); }, [schedule]);
  useEffect(() => { save("sl_history",  history);  }, [history]);
  useEffect(() => { save("sl_weights",  programWeights); }, [programWeights]);

  function startWorkout(key) {
    setPrevScreen(screen);
    setActiveWorkout(key);
    setScreen("active");
  }

  function finishWorkout(completedKey, completedWeights, completedDone) {
    const today = new Date();
    const dateStr = today.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });

    const prog = PROGRAMS[completedKey];

    // Build history entry
    const exercises = prog.exercises.map((ex, i) => ({
      ...ex, ...(completedWeights ? completedWeights[i] : {}),
    }));
    setHistory(prev => [{ key: completedKey, date: dateStr, exercises }, ...prev]);

    // Auto-increment: for each barbell exercise where ALL sets were completed → +2.5kg total (1.25 per side)
    if (completedWeights && completedDone) {
      setProgramWeights(prev => {
        const updated = { ...prev };
        updated[completedKey] = completedWeights.map((w, i) => {
          const ex = prog.exercises[i];
          if (ex.unit || ex.weight === 0) return w; // skip non-barbell / bodyweight
          const doneSet = completedDone[i] || new Set();
          const allSetsComplete = doneSet.size >= w.sets;
          return allSetsComplete
            ? { ...w, weight: Math.round((w.weight + 2.5) * 100) / 100 }
            : w;
        });
        return updated;
      });
    }

    // Advance schedule
    setSchedule(prev => {
      const next = prev.slice(1);
      if (next.length > 0) next[0] = { ...next[0], label: "Today" };
      return next;
    });

    setActiveWorkout(null);
    setScreen("home");
  }

  function addPastWorkout(entry) {
    setHistory(prev => {
      const updated = [entry, ...prev].sort((a, b) => new Date(b.date) - new Date(a.date));
      save("sl_history", updated);
      return updated;
    });
  }

  function goBack() { setScreen(prevScreen); }

  function navigate(id) {
    if (id === "home" && activeWorkout) setScreen("active");
    else setScreen(id);
  }

  const isActive = screen === "active";
  const navItems = NAV.map(n =>
    n.id === "home" && activeWorkout ? { ...n, label: "Workout", icon: "💪" } : n
  );

  return (
    <div style={{
      background: BG, minHeight: "100vh", maxWidth: 430, margin: "0 auto",
      display: "flex", flexDirection: "column",
      fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif",
    }}>
      {!isActive && (
        <div style={{ background: CARD, padding: "14px 20px 10px", textAlign: "center" }}>
          <span style={{ color: WHITE, fontSize: 18, fontWeight: 700 }}>StrongLifts</span>
        </div>
      )}

      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <div style={{ display: isActive ? "flex" : "none", flexDirection: "column", flex: 1, overflow: "hidden" }}>
          {activeWorkout && (
            <WorkoutScreen
              progKey={activeWorkout}
              initialWeights={programWeights[activeWorkout]}
              onFinish={finishWorkout}
              onBack={goBack}
            />
          )}
        </div>

        {!isActive && screen === "home"     && <HomeScreen onStart={startWorkout} schedule={schedule} programWeights={programWeights} />}
        {!isActive && screen === "programs" && <ProgramsScreen />}
        {!isActive && screen === "history"  && <HistoryScreen history={history} onAddPast={addPastWorkout} />}
        {!isActive && screen === "progress" && <ProgressScreen />}
        {!isActive && screen === "settings" && <SettingsScreen />}
      </div>

      <div style={{ background: CARD, borderTop: `1px solid ${DIM}`, display: "flex", justifyContent: "space-around", padding: "8px 0 12px", flexShrink: 0 }}>
        {navItems.map(n => {
          const isSelected = isActive ? n.id === "home" : screen === n.id;
          return (
            <button key={n.id} onClick={() => navigate(n.id)} style={{
              background: "none", border: "none", cursor: "pointer",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
              color: isSelected ? RED : GREY,
            }}>
              <span style={{ fontSize: 20 }}>{n.icon}</span>
              <span style={{ fontSize: 10, fontWeight: isSelected ? 700 : 400 }}>{n.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
